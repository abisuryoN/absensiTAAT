
# Tahapan pipeline
stages:
  - test
  - secret-detection

# Aktifkan Secret Detection
variables:
  SECRET_DETECTION_ENABLED: "true"

# Tes apakah GitLab Runner bisa menjalankan job
runner_test:
  stage: test
  script:
    - echo "GitLab CI Runner berhasil menjalankan job"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Job Secret Detection
secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
