
name: Deploy Laravel to Insomnia247

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.md.save"
      - ".gitlab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify production and deploy safely
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -eu

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' TARGET_SHA='$TARGET_SHA' sh -s" <<'REMOTE'
          set -eu

          cd "$DEPLOY_PATH"

          echo "--- Check branch ---"
          test "$(git branch --show-current)" = "main"

          echo "--- Check local changes ---"
          if ! git diff --quiet; then
            echo "ERROR: Tracked local changes exist. Deployment stopped."
            exit 1
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ERROR: Untracked files exist. Deployment stopped."
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "--- Fetch target commit ---"
          git fetch origin main

          echo "--- Verify target commit ---"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor HEAD "$TARGET_SHA"

          echo "--- Verify dependencies ---"
          test -f .env
          test -f vendor/autoload.php
          test -f public/build/manifest.json

          echo "--- Update application code ---"
          git merge --ff-only "$TARGET_SHA"

          echo "--- Verify deployed commit ---"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          php artisan --version

          echo "Deployment code update completed."
          REMOTE
